<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybierz Pytanie</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        body { 
            background: white; 
            font-family: "Courier New", Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
        }

        h1 { 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            font-size: 42px; 
            font-weight: bold; 
            margin-bottom: 50px; 
        }

        .board { 
            display: flex; 
            gap: 25px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }

        .column { 
            border: 2px solid black; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-width: 180px; 
        }

        .category-name { 
            background: #eee; 
            padding: 15px 20px; 
            margin-bottom: 25px; 
            font-weight: bold; 
            font-size: 24px; 
            border: 1px solid #ccc;
            width: 100%;
            text-align: center;
        }

        .question-item { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 20px; 
            padding: 10px;
            transition: 0.3s;
        }

        /* Duże przyciski z numerami */
        .btn { 
            border: 3px solid black; 
            padding: 15px 30px; 
            text-decoration: none; 
            color: black; 
            font-weight: bold; 
            font-size: 32px; 
            display: inline-block;
            background: white;
        }

        /* Duże checkboxy */
        .done-checkbox { 
            width: 35px; 
            height: 35px; 
            pointer-events: none; /* Zablokowane dla graczy */
            cursor: default;
        }

        /* Styl dla zaliczonych kategorii */
        .completed { 
            background-color: #d4edda; 
            border-radius: 10px;
        }
        
        .completed .btn {
            background-color: #f0f0f0;
            color: #888;
            border-color: #ccc;
        }
    </style>
</head>
<body>
    <h1>TURNIEJ - TABLICA</h1>
    
    <div class="board" id="main-board">
        </div>

    <script>
        const categories = [
            { name: "ANIME", id: "Anime" }, 
            { name: "GRY", id: "Gry" },
            { name: "HISTORIA", id: "Historia" }, 
            { name: "MUZYKA", id: "Muzyka" },
            { name: "PRAWO JAZDY", id: "Prawojazdy" }, 
            { name: "RYMOWANKI", id: "Rymowanki" }
        ];

        const board = document.getElementById('main-board');
        
        // Generowanie tabeli (duże elementy)
        categories.forEach(cat => {
            let html = `<div class="column"><div class="category-name">${cat.name}</div>`;
            for(let i=1; i<=4; i++) {
                const qId = `${cat.id}${i}`;
                html += `
                <div class="question-item" id="item-${qId}">
                    <a href="${qId}.html" class="btn">${i}</a>
                    <input type="checkbox" class="done-checkbox" id="${qId}">
                </div>`;
            }
            html += `</div>`;
            board.innerHTML += html;
        });

        // Konfiguracja Pushera (do odbierania sygnałów z admina)
        const pusher = new Pusher('d811d3d8cce5cce12baf', { cluster: 'eu' });
        const channel = pusher.subscribe('quiz-channel');

        // Obsługa przełączania stron
        channel.bind('redirect-event', function(data) {
            if (data.url) window.location.href = data.url;
        });

        // Obsługa zdalnego odznaczania checkboxów
        channel.bind('check-event', function(data) {
            const cb = document.getElementById(data.id);
            const container = document.getElementById('item-' + data.id);
            if (cb) {
                cb.checked = data.status;
                if(data.status) {
                    container.classList.add('completed');
                } else {
                    container.classList.remove('completed');
                }
                // Zapisujemy w przeglądarce, żeby po odświeżeniu nie zniknęło
                localStorage.setItem(data.id, data.status);
            }
        });

        // Przy starcie sprawdź zapisany stan w localStorage
        window.onload = () => {
            categories.forEach(cat => {
                for(let i=1; i<=4; i++) {
                    const qId = `${cat.id}${i}`;
                    const saved = localStorage.getItem(qId) === 'true';
                    const cb = document.getElementById(qId);
                    const container = document.getElementById('item-' + qId);
                    if(saved && cb) {
                        cb.checked = true;
                        container.classList.add('completed');
                    }
                }
            });
        };
    </script>
</body>
</html>
