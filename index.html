<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica Turniejowa</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        body { 
            background: white; 
            font-family: "Courier New", Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 40px 20px; margin: 0;
        }
        h1 { text-transform: uppercase; letter-spacing: 5px; font-size: 42px; font-weight: bold; margin-bottom: 50px; text-align: center; }
        
        .board { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
        .column { border: 2px solid black; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 180px; }
        
        .category-name { 
            background: #eee; padding: 15px 20px; margin-bottom: 25px; 
            font-weight: bold; font-size: 24px; border: 1px solid #ccc; width: 100%; text-align: center; box-sizing: border-box;
        }

        .question-item { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding: 10px; transition: 0.3s; border-radius: 10px; }
        
        .btn { 
            border: 3px solid black; padding: 15px 30px; text-decoration: none; 
            color: black; font-weight: bold; font-size: 32px; background: white; transition: 0.3s;
            cursor: pointer;
        }
        
        .done-checkbox { width: 35px; height: 35px; pointer-events: none; }

        /* Styl zablokowanego / rozwiązanego pytania */
        .completed { background-color: #ffeaea; border: 2px dashed #ff0000; }
        .completed .btn { background-color: #f0f0f0; color: #bbb; border-color: #ddd; text-decoration: line-through; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>TURNIEJ - WYBIERZ PYTANIE</h1>
    
    <div class="board" id="main-board"></div>

    <script>
        const categories = [
            { name: "ANIME", id: "Anime" }, { name: "GRY", id: "Gry" },
            { name: "HISTORIA", id: "Historia" }, { name: "MUZYKA", id: "Muzyka" },
            { name: "PRAWO JAZDY", id: "Prawojazdy" }, { name: "RYMOWANKI", id: "Rymowanki" }
        ];

        const board = document.getElementById('main-board');
        
        // Budowanie tablicy
        categories.forEach(cat => {
            let html = `<div class="column"><div class="category-name">${cat.name}</div>`;
            for(let i=1; i<=4; i++) {
                const qId = `${cat.id}${i}`;
                html += `
                <div class="question-item" id="item-${qId}">
                    <a href="${qId}.html" class="btn" id="link-${qId}">${i}</a>
                    <input type="checkbox" class="done-checkbox" id="${qId}">
                </div>`;
            }
            html += `</div>`;
            board.innerHTML += html;
        });

        // Konfiguracja Pushera
        const pusher = new Pusher('d811d3d8cce5cce12baf', { cluster: 'eu' });
        const channel = pusher.subscribe('quiz-channel');

        // Odbieranie sygnału: PRZEKIEROWANIE
        channel.bind('redirect-event', function(data) {
            if (data.url) window.location.href = data.url;
        });

        // Odbieranie sygnału: BLOKADA/ODBLOKOWANIE PYTANIA
        channel.bind('check-event', function(data) {
            updateCheck(data.id, data.status);
        });

        // Funkcja blokująca lub odblokowująca pytanie
        function updateCheck(id, status) {
            const cb = document.getElementById(id);
            const container = document.getElementById('item-' + id);
            const link = document.getElementById('link-' + id);
            
            if (cb && container && link) {
                cb.checked = status;
                localStorage.setItem(id, status); // Zapamiętanie w przeglądarce
                
                if (status) {
                    container.classList.add('completed');
                    link.style.pointerEvents = 'none'; // Blokuje możliwość kliknięcia
                    link.onclick = function(e) { e.preventDefault(); };
                } else {
                    container.classList.remove('completed');
                    link.style.pointerEvents = 'auto'; // Przywraca możliwość kliknięcia
                    link.onclick = null;
                }
            }
        }

        // Przywracanie stanu po odświeżeniu strony
        window.onload = () => {
            categories.forEach(cat => {
                for(let i=1; i<=4; i++) {
                    const qId = `${cat.id}${i}`;
                    const saved = localStorage.getItem(qId) === 'true';
                    if(saved) updateCheck(qId, true);
                }
            });
        };
    </script>
</body>
</html>
